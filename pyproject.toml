[project]
name = "sam3-smartinpainter"
description = "Auto face detection + inpainting node using SAM3"
version = "1.0.0"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"

# Keep dependencies minimal - ComfyUI Manager will use requirements.txt instead
dependencies = [
    "opencv-python>=4.5.0",
    "omegaconf>=2.1.0", 
    "hydra-core>=1.1.0",
]

[project.urls]
Repository = "https://github.com/majidfida/SAM3_SmartInpainter"
Documentation = "https://github.com/majidfida/SAM3_SmartInpainter#readme"
"Bug Tracker" = "https://github.com/majidfida/SAM3_SmartInpainter/issues"

[tool.comfy]
PublisherId = "majidfida"
DisplayName = "SAM3 Smart Inpainter"
Dependencies = ["yolain/ComfyUI-Easy-Sam3"]
Icon = "icon.png"
Includes = [
    "SAM3_SmartInpainter.py",
    "__init__.py"
]
